<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${empresa.nome})}"></head>
<body>
<header th:replace="~{fragments/layout :: cabecalho}"></header>
<main class="container">
    <div class="cabecalho-pagina">
        <div>
            <h1 th:text="${empresa.nome}">Empresa</h1>
            <p class="subtitulo">Empresa parceira</p>
        </div>
        <div class="acoes">
            <a class="botao" th:href="@{/empresas/{id}/editar(id=${empresa.id})}">Editar</a>
            <form method="post" th:action="@{/empresas/{id}/excluir(id=${empresa.id})}"
                  onsubmit="return confirm('Excluir esta empresa e as vantagens dela?');">
                <button class="botao perigo" type="submit">Excluir</button>
            </form>
            <a class="botao secundario" th:href="@{/empresas}">Voltar</a>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <div class="cartao">
        <dl class="dados">
            <dt>CNPJ</dt><dd th:text="${empresa.cnpj}"></dd>
            <dt>E-mail</dt><dd th:text="${empresa.email}"></dd>
            <dt>Telefone</dt><dd th:text="${empresa.telefone} ?: '—'"></dd>
        </dl>
    </div>

    <h2>Vantagens oferecidas</h2>
    <p class="vazio cartao" th:if="${#lists.isEmpty(empresa.vantagens)}">
        Nenhuma vantagem cadastrada. O cadastro de vantagens chega na próxima sprint.
    </p>
    <div class="vantagens">
        <article class="vantagem" th:each="v : ${empresa.vantagens}">
            <img th:src="${v.fotoUrl}" th:alt="${v.titulo}">
            <div>
                <h3 th:text="${v.titulo}"></h3>
                <p th:text="${v.descricao}"></p>
                <span class="saldo" th:text="${v.custoMoedas} + ' moedas'"></span>
            </div>
        </article>
    </div>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>

spring.application.name=moeda-estudantil

# Banco H2 em arquivo (pasta ./dados, ignorada pelo Git)
spring.datasource.url=jdbc:h2:file:./dados/moeda-estudantil;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# ORM (JPA/Hibernate): o esquema é gerado/atualizado a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Console web do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

# Critérios das transferências entre alunos (RN14, RN15, RN17, RN20)
moeda.transferencia.valor-maximo=100
moeda.transferencia.limite-mensal=300
moeda.transferencia.maximo-pendentes=3
moeda.transferencia.prazo-aprovacao-dias=7
moeda.transferencia.tamanho-minimo-motivo=10

# Sessão só por cookie (evita ;jsessionid= nas URLs)
server.servlet.session.tracking-modes=cookie
